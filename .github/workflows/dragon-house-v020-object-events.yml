name: Dragon House v0.20 object event strangler QA

on:
  push:
    branches:
      - dev/dragon-house-v020-object-event-strangler
    paths:
      - 'dragon_house_clean/scripts/world_event_store.gd'
      - 'dragon_house_clean/scripts/world_event_gate.gd'
      - 'dragon_house_clean/scripts/object_event_reducer.gd'
      - 'dragon_house_clean/scripts/object_event_runtime.gd'
      - 'dragon_house_clean/scripts/world_model.gd'
      - 'dragon_house_clean/tests/test_object_event_*.gd'
      - 'dragon_house_clean/tests/test_object_lifecycle_v017.gd'
      - 'dragon_house_clean/tests/test_ambient_creatures_v018.gd'
      - '.github/workflows/dragon-house-v020-object-events.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Godot 4.7.2
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Parse
        shell: bash
        run: |
          cd dragon_house_clean
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/import.log 2>&1 || true
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/import.log; then
            cat /tmp/import.log
            exit 1
          fi
      - name: Object event and regression suite
        shell: bash
        run: |
          cd dragon_house_clean
          set -euo pipefail
          tests=(
            tests/test_object_event_gate_v020.gd
            tests/test_object_event_replay_v020.gd
            tests/test_object_event_migration_v020.gd
            tests/test_object_lifecycle_v017.gd
            tests/test_ambient_creatures_v018.gd
            tests/test_content_viewer_v018.gd
            tests/test_guest_room_access_v018.gd
            tests/test_model.gd
          )
          for t in "${tests[@]}"; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
