name: Dragon House LFS intake and Godot acceptance

on:
  push:
    branches: [dragon-house-fallout-fresh]
    paths:
      - 'dragon_house_clean/**'
      - '.github/workflows/dragon-house-lfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-acceptance:
    name: Verify actual LFS bytes and Godot runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout with LFS content
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch LFS objects (no pointers)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          echo "LFS_PATHS=$(git lfs ls-files | wc -l)" >> "$GITHUB_ENV"
          test "$(git lfs ls-files | wc -l)" -ge 2408

      - name: Audit all 2409 normalized paths and canonical identities
        shell: bash
        run: |
          cd dragon_house_clean
          python3 tools/ci_lfs_asset_audit.py --project . --report LFS_ACCEPTANCE_QA.json
          cat LFS_ACCEPTANCE_QA.json

      - name: Download official Godot 4.7.2 Linux
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/Godot_4.7.2.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/Godot_4.7.2.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Import actual LFS textures into Godot
        shell: bash
        run: |
          cd dragon_house_clean
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > godot_import.log 2>&1
          if grep -Eq "SCRIPT ERROR|Parse Error" godot_import.log; then
            tail -80 godot_import.log
            exit 1
          fi

      - name: Test world, media, actual resident artwork and private-room exclusions
        shell: bash
        run: |
          cd dragon_house_clean
          set -euo pipefail
          : > godot_tests.log
          for t in \
            tests/test_model.gd \
            tests/test_cutaway_groups.gd \
            tests/test_camera_construction.gd \
            tests/test_locomotion.gd \
            tests/test_social.gd \
            tests/test_media.gd \
            tests/test_av.gd \
            tests/test_snapshot.gd \
            tests/test_asset_binding.gd \
            tests/test_interior_layers.gd \
            tests/test_registry_integration.gd \
            tests/test_reference_books.gd \
            tests/test_bank_gallery.gd; do
            echo "RUN $t" | tee -a godot_tests.log
            result="$(timeout 80s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$result" | tee -a godot_tests.log; exit 1; }
            echo "$result" | tee -a godot_tests.log
            if ! echo "$result" | grep -q "_PASS";then exit 1;fi
            if echo "$result" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed";then exit 1;fi
          done
          python3 tests/test_import_nov_assets.py | tee -a godot_tests.log

      - name: Store private audit proof, never original personal imagery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-lfs-qa-report
          path: |
            dragon_house_clean/LFS_ACCEPTANCE_QA.json
            dragon_house_clean/godot_import.log
            dragon_house_clean/godot_tests.log
          if-no-files-found: ignore
          retention-days: 7

