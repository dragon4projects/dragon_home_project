name: Dragon House Iteration 2 physical room volume

on:
  push:
    branches: [integration/dragon-house-iter2-room-volume]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Hydrate review assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          bash dragon_house_clean/tools/hydrate_iter1_candidate_assets.sh

      - name: Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Import
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 600s /tmp/Godot_v4.7.2-stable_linux.x86_64             --headless --path . --editor --quit > godot_import_room_volume.log 2>&1
          if grep -Eq "SCRIPT ERROR|Parse Error" godot_import_room_volume.log; then
            tail -200 godot_import_room_volume.log
            exit 1
          fi

      - name: Physical room smoke regressions
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          : > godot_tests_room_volume.log
          marker="data/integration_candidates/ITER1_OWNER_REVIEW.enabled"
          mv "$marker" /tmp/ITER1_OWNER_REVIEW.enabled
          restore_marker() {
            if [ -f /tmp/ITER1_OWNER_REVIEW.enabled ]; then
              mv /tmp/ITER1_OWNER_REVIEW.enabled "$marker"
            fi
          }
          trap restore_marker EXIT
          for t in tests/test_model.gd tests/test_xz_topology_iter2.gd tests/test_room_volume_iter2.gd tests/test_camera_construction.gd
          do
            echo "RUN PROD $t" | tee -a godot_tests_room_volume.log
            result="$(timeout 100s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || {
              echo "$result" | tee -a godot_tests_room_volume.log
              exit 1
            }
            echo "$result" | tee -a godot_tests_room_volume.log
            echo "$result" | grep -q "_PASS"
            ! echo "$result" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
          restore_marker
          trap - EXIT

          echo "RUN REVIEW tests/test_iter2_runtime_scene.gd" | tee -a godot_tests_room_volume.log
          result="$(timeout 100s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_iter2_runtime_scene.gd 2>&1)" || {
            echo "$result" | tee -a godot_tests_room_volume.log
            exit 1
          }
          echo "$result" | tee -a godot_tests_room_volume.log
          echo "$result" | grep -q "ITER2_RUNTIME_SCENE_PASS"
          ! echo "$result" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"

      - name: Render room-volume evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          cd dragon_house_clean
          mkdir -p private_review
          xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path .             --rendering-method gl_compatibility             --script res://tests/capture_v014_review.gd | tee room_volume_render.log
          grep -q "V014_RENDER_REVIEW_PASS" room_volume_render.log

      - name: Upload visual QA immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DragonHouse-Iter2-RoomVolume-Visual-QA
          path: |
            dragon_house_clean/godot_import_room_volume.log
            dragon_house_clean/godot_tests_room_volume.log
            dragon_house_clean/room_volume_render.log
            dragon_house_clean/private_review/v014_house.png
            dragon_house_clean/private_review/v014_common_r3.png
            dragon_house_clean/private_review/v014_library_r2.png
            dragon_house_clean/private_review/v014_cinema_activity.png
            dragon_house_clean/assets/rooms/common/R3/backdrop.png
            dragon_house_clean/assets/rooms/common/R3/back_decor.png
            dragon_house_clean/assets/rooms/common/R3/furniture_back.png
            dragon_house_clean/assets/rooms/common/R3/foreground.png
            dragon_house_clean/assets/rooms/library/R2/backdrop.png
            dragon_house_clean/assets/rooms/library/R2/back_decor.png
            dragon_house_clean/assets/rooms/library/R2/furniture_back.png
            dragon_house_clean/assets/rooms/library/R2/foreground.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Export templates
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot_export.tpz             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -jo /tmp/godot_export.tpz templates/version.txt templates/macos.zip -d "$dest"

      - name: Export macOS Universal
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cd dragon_house_clean
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path .             --export-release "macOS" ../releases/DragonHouse_Iter2_RoomVolume_macOS_Universal.zip             > ../releases/mac_export_room_volume.log 2>&1
          cd ../releases
          unzip -t DragonHouse_Iter2_RoomVolume_macOS_Universal.zip | tail -1
          unzip -l DragonHouse_Iter2_RoomVolume_macOS_Universal.zip | grep -qi 'gdsqlite.*macos.*template_release'
          cp DragonHouse_Iter2_RoomVolume_macOS_Universal.zip DragonHouse_Iter2_RoomVolume_macOS15_M1.zip

      - name: Upload Mac build
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
        uses: actions/upload-artifact@v4
        with:
          name: DragonHouse-Iter2-RoomVolume-macOS15-M1
          path: |
            releases/DragonHouse_Iter2_RoomVolume_macOS15_M1.zip
            releases/mac_export_room_volume.log
          retention-days: 7

      - name: Upload QA
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
        uses: actions/upload-artifact@v4
        with:
          name: DragonHouse-Iter2-RoomVolume-QA
          path: |
            dragon_house_clean/godot_import_room_volume.log
            dragon_house_clean/godot_tests_room_volume.log
            dragon_house_clean/room_volume_render.log
            dragon_house_clean/private_review/v014_house.png
            dragon_house_clean/private_review/v014_common_r3.png
            dragon_house_clean/private_review/v014_library_r2.png
            dragon_house_clean/private_review/v014_cinema_activity.png
          if-no-files-found: ignore
          retention-days: 7
