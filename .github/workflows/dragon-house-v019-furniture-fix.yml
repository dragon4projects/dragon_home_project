name: Dragon House v0.19 furniture semantic LOD fix QA

on:
  push:
    branches:
      - fix/dragon-house-v019-furniture-contract-semantic-lod
    paths:
      - 'dragon_house_clean/tests/test_furniture_contract_v10.gd'
      - 'dragon_house_clean/tests/test_lazy_room_art_v10.gd'
      - 'dragon_house_clean/tests/test_width_anchors_v012.gd'
      - 'dragon_house_clean/scripts/main.gd'
      - '.github/workflows/dragon-house-v019-furniture-fix.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Godot 4.7.2
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse
        shell: bash
        run: |
          cd dragon_house_clean
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/import.log 2>&1 || true
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/import.log; then cat /tmp/import.log; exit 1; fi
      - name: Furniture semantic regressions
        shell: bash
        run: |
          cd dragon_house_clean
          set -euo pipefail
          tests=(
            tests/test_furniture_contract_v10.gd
            tests/test_lazy_room_art_v10.gd
            tests/test_room_capacity_v06.gd
            tests/test_room_lod_v06.gd
            tests/test_level_mode_v019.gd
          )
          for t in "${tests[@]}"; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
