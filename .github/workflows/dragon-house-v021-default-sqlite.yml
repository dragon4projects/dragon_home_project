name: Dragon House v0.21 default SQLite cutover QA

on:
  push:
    branches:
      - fix/dragon-house-v021-default-sqlite-cutover
    paths:
      - 'dragon_house_clean/scripts/object_event_runtime.gd'
      - 'dragon_house_clean/tests/test_object_event_*_v020.gd'
      - 'dragon_house_clean/tests/test_object_event_*_v021.gd'
      - '.github/workflows/dragon-house-v021-default-sqlite.yml'

concurrency:
  group: dragon-house-v021-default-sqlite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch vendored SQLite native bytes
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="dragon_house_clean/addons/godot-sqlite/bin/**"
          cd dragon_house_clean
          sha256sum -c addons/godot-sqlite/SHA256SUMS.txt
          touch assets/.gdignore

      - name: Download official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Prove automatic cutover and compatibility lanes
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/import.log 2>&1 || true
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/import.log; then
            tail -160 /tmp/import.log
            exit 1
          fi
          tests=(
            tests/test_object_event_default_sqlite_v021.gd
            tests/test_object_event_sqlite_v021.gd
            tests/test_object_event_json_to_sqlite_v021.gd
            tests/test_object_event_snapshot_to_sqlite_v021.gd
            tests/test_object_event_sqlite_recovery_v021.gd
            tests/test_object_event_sqlite_canonical_loss_v021.gd
            tests/test_object_event_sqlite_backup_warning_v021.gd
            tests/test_object_event_projection_rebuild_v021.gd
            tests/test_object_event_gate_v020.gd
            tests/test_object_event_replay_v020.gd
            tests/test_object_event_migration_v020.gd
            tests/test_object_lifecycle_v017.gd
            tests/test_ambient_creatures_v018.gd
          )
          for t in "${tests[@]}"; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
