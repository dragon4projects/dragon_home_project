name: Dragon House v0.21 backup semantics QA

on:
  push:
    branches:
      - fix/dragon-house-v021-backup-warning-semantics
    paths:
      - 'dragon_house_clean/scripts/world_event_store.gd'
      - 'dragon_house_clean/scripts/world_event_store_sqlite.gd'
      - 'dragon_house_clean/scripts/object_event_runtime.gd'
      - 'dragon_house_clean/tests/test_object_event_sqlite_backup_warning_v021.gd'
      - 'dragon_house_clean/tests/test_object_event_sqlite_canonical_loss_v021.gd'
      - '.github/workflows/dragon-house-v021-backup-semantics.yml'

concurrency:
  group: dragon-house-v021-backup-semantics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Install pinned Godot and SQLite
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          curl -fLsS --retry 3 -o /tmp/sqlite.zip \
            https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip
          echo "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0  /tmp/sqlite.zip" | sha256sum -c -
          rm -rf /tmp/sqlite-addon
          mkdir -p /tmp/sqlite-addon
          unzip -q /tmp/sqlite.zip -d /tmp/sqlite-addon
          DESCRIPTOR="$(find /tmp/sqlite-addon -name gdsqlite.gdextension -type f | head -1)"
          test -n "$DESCRIPTOR"
          mkdir -p dragon_house_clean/addons
          cp -a "$(dirname "$DESCRIPTOR")" dragon_house_clean/addons/godot-sqlite
          touch dragon_house_clean/assets/.gdignore
      - name: Parse and run backup semantics regressions
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/import.log 2>&1 || true
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/import.log; then
            tail -160 /tmp/import.log
            exit 1
          fi
          tests=(
            tests/test_object_event_sqlite_backup_warning_v021.gd
            tests/test_object_event_sqlite_canonical_loss_v021.gd
            tests/test_object_event_sqlite_v021.gd
            tests/test_object_event_json_to_sqlite_v021.gd
            tests/test_object_event_sqlite_recovery_v021.gd
            tests/test_object_event_projection_rebuild_v021.gd
            tests/test_object_event_gate_v020.gd
            tests/test_object_lifecycle_v017.gd
          )
          for t in "${tests[@]}"; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
