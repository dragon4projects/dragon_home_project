name: Dragon House v0.21 final SQLite acceptance

on:
  push:
    branches:
      - dev/dragon-house-v021-sqlite-backend-proof
    paths:
      - '.gitattributes'
      - 'dragon_house_clean/addons/godot-sqlite/**'
      - 'dragon_house_clean/scripts/world_event_store.gd'
      - 'dragon_house_clean/scripts/world_event_store_sqlite.gd'
      - 'dragon_house_clean/scripts/object_event_runtime.gd'
      - 'dragon_house_clean/tests/test_object_event_*_v021.gd'
      - '.github/workflows/dragon-house-v021-final.yml'
  workflow_dispatch:

concurrency:
  group: dragon-house-v021-final
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch and verify vendored SQLite addon
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="dragon_house_clean/addons/godot-sqlite/bin/**"
          test "$(git lfs ls-files | grep -c 'dragon_house_clean/addons/godot-sqlite/bin/')" -eq 6
          cd dragon_house_clean
          sha256sum -c addons/godot-sqlite/SHA256SUMS.txt
          grep -q 'compatibility_minimum = "4.7"' addons/godot-sqlite/gdsqlite.gdextension
          test -f addons/godot-sqlite/bin/libgdsqlite.linux.template_debug.x86_64.so
          test -f addons/godot-sqlite/bin/libgdsqlite.linux.template_release.x86_64.so

      - name: Download official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
          touch dragon_house_clean/assets/.gdignore

      - name: Parse and run complete object-event strangler suite
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 240s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/v021-final-import.log 2>&1 || true
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/v021-final-import.log; then
            tail -160 /tmp/v021-final-import.log
            exit 1
          fi
          tests=(
            tests/test_object_event_default_sqlite_v021.gd
            tests/test_object_event_sqlite_v021.gd
            tests/test_object_event_json_to_sqlite_v021.gd
            tests/test_object_event_sqlite_recovery_v021.gd
            tests/test_object_event_sqlite_canonical_loss_v021.gd
            tests/test_object_event_sqlite_backup_warning_v021.gd
            tests/test_object_event_snapshot_to_sqlite_v021.gd
            tests/test_object_event_projection_rebuild_v021.gd
            tests/test_object_event_gate_v020.gd
            tests/test_object_event_replay_v020.gd
            tests/test_object_event_migration_v020.gd
            tests/test_object_lifecycle_v017.gd
            tests/test_ambient_creatures_v018.gd
            tests/test_guest_room_access_v018.gd
          )
          for t in "${tests[@]}"; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
          echo "SQLITE_FINAL_LINUX_V021_PASS"

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch and verify vendored SQLite addon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git lfs install --local
          git lfs pull --include="dragon_house_clean/addons/godot-sqlite/bin/**"
          $checks = @{
            "dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.linux.template_debug.x86_64.so" = "a2fa1dddab744135a3ce0f16da6a84d41ec981ffc85560ecb3abf54d9ad4c393"
            "dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.linux.template_release.x86_64.so" = "6bc7d4f045ba1903c08931a4f8f39be6a5424d37971d3f3a068f618846fc21ec"
            "dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.windows.template_debug.x86_64.dll" = "e3ae3b46b59eadcd513f8d7d6e7c0c15e173696e145594094d7f4f3cc96c7fe7"
            "dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.windows.template_release.x86_64.dll" = "ba79b9bbf916c4ed2eb22ac719051c4a4258e460c4a354590b071beb9a87fedb"
            "dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.macos.template_debug.framework/libgdsqlite.macos.template_debug" = "485d955d7208bc39d168283b68367012dd73006d6c69a6de888e64e3cfcaf75d"
            "dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.macos.template_release.framework/libgdsqlite.macos.template_release" = "98f9e74a14be4f97a5c2b2095a427516543c3b0251b677e0bf507299f977abe9"
          }
          foreach ($file in $checks.Keys) {
            if (-not (Test-Path $file)) { throw "Vendored SQLite binary missing: $file" }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $checks[$file]) { throw "Vendored SQLite checksum mismatch: $file" }
          }

      - name: Download official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\godot.zip" -Algorithm SHA256).Hash.ToLower() -ne "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953") { throw "Godot digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" "$env:RUNNER_TEMP\godot" -Force
          $godot = (Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter "Godot_v4.7.2-stable_win64.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot exe missing" }
          New-Item -ItemType File -Path "dragon_house_clean\assets\.gdignore" -Force | Out-Null
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $godot --headless --version

      - name: Native Windows truth-path proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tests = @(
            "res://tests/test_object_event_default_sqlite_v021.gd",
            "res://tests/test_object_event_sqlite_v021.gd",
            "res://tests/test_object_event_json_to_sqlite_v021.gd",
            "res://tests/test_object_event_sqlite_recovery_v021.gd",
            "res://tests/test_object_event_sqlite_canonical_loss_v021.gd",
            "res://tests/test_object_event_sqlite_backup_warning_v021.gd",
            "res://tests/test_object_event_snapshot_to_sqlite_v021.gd",
            "res://tests/test_object_event_projection_rebuild_v021.gd"
          )
          foreach ($test in $tests) {
            Write-Host "RUN $test"
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = "$env:GODOT_BIN"
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            foreach ($arg in @("--headless","--path","dragon_house_clean","--script",$test)) {
              [void]$psi.ArgumentList.Add($arg)
            }
            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = $psi
            [void]$proc.Start()
            $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
            $stderrTask = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit(90000)) {
              try { $proc.Kill($true) } catch {}
              throw "$test timed out after 90 seconds"
            }
            $output = $stdoutTask.GetAwaiter().GetResult() + $stderrTask.GetAwaiter().GetResult()
            Write-Host $output
            if ($proc.ExitCode -ne 0) { throw "$test exit code $($proc.ExitCode)" }
            if ($output -notmatch "_PASS") { throw "$test missing PASS marker" }
            if ($output -match "SCRIPT ERROR|Parse Error|Assertion failed") { throw "$test contains script failure" }
          }
          Write-Host "SQLITE_FINAL_WINDOWS_V021_PASS"

  macos-native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch and verify vendored SQLite addon
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="dragon_house_clean/addons/godot-sqlite/bin/**"
          cd dragon_house_clean
          shasum -a 256 -c addons/godot-sqlite/SHA256SUMS.txt
          test -d addons/godot-sqlite/bin/libgdsqlite.macos.template_debug.framework
          test -d addons/godot-sqlite/bin/libgdsqlite.macos.template_release.framework

      - name: Download official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  $RUNNER_TEMP/godot.zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          touch dragon_house_clean/assets/.gdignore
          "$GODOT_BIN" --headless --version

      - name: Native macOS truth-path proof
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          for t in \
            tests/test_object_event_default_sqlite_v021.gd \
            tests/test_object_event_sqlite_v021.gd \
            tests/test_object_event_json_to_sqlite_v021.gd \
            tests/test_object_event_sqlite_recovery_v021.gd \
            tests/test_object_event_sqlite_canonical_loss_v021.gd \
            tests/test_object_event_sqlite_backup_warning_v021.gd \
            tests/test_object_event_snapshot_to_sqlite_v021.gd \
            tests/test_object_event_projection_rebuild_v021.gd; do
            echo "RUN $t"
            out_file="$RUNNER_TEMP/v021-native-test.out"
            if ! python3 - "$GODOT_BIN" "$t" "$PWD" >"$out_file" 2>&1 <<'PY'
import subprocess, sys
godot, test, cwd = sys.argv[1:4]
try:
    p = subprocess.run(
        [godot, "--headless", "--path", cwd, "--script", "res://" + test],
        cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
        text=True, timeout=90)
except subprocess.TimeoutExpired as e:
    print(e.stdout or "")
    print("NATIVE_TEST_TIMEOUT", test)
    raise SystemExit(124)
print(p.stdout or "")
raise SystemExit(p.returncode)
PY
            then
              cat "$out_file"
              exit 1
            fi
            out="$(cat "$out_file")"
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed|NATIVE_TEST_TIMEOUT"
          done
          echo "SQLITE_FINAL_MACOS_V021_PASS"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Audit all LFS bytes and vendored SQLite checksums
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          test "$(git lfs ls-files | wc -l)" -ge 2414
          cd dragon_house_clean
          sha256sum -c addons/godot-sqlite/SHA256SUMS.txt
          python3 tools/ci_lfs_asset_audit.py --project . --report /tmp/v021-final-lfs.json

      - name: Download official Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          curl -fLsS --retry 3 -o /tmp/godot_export.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -jo /tmp/godot_export.tpz \
            templates/version.txt templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64.exe templates/macos.zip -d "$dest"

      - name: Import, test and export vendored SQLite packages
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 900s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/v021-final-export-import.log 2>&1
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/v021-final-export-import.log; then
            tail -160 /tmp/v021-final-export-import.log
            exit 1
          fi
          for t in \
            tests/test_object_event_default_sqlite_v021.gd \
            tests/test_object_event_sqlite_v021.gd \
            tests/test_object_event_json_to_sqlite_v021.gd \
            tests/test_object_event_sqlite_recovery_v021.gd \
            tests/test_object_event_sqlite_canonical_loss_v021.gd \
            tests/test_object_event_sqlite_backup_warning_v021.gd \
            tests/test_object_event_snapshot_to_sqlite_v021.gd \
            tests/test_object_event_projection_rebuild_v021.gd; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
          mkdir -p ../releases
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "Windows Desktop" ../releases/DragonHouse_v021_SQLite.exe \
            > ../releases/v021_final_win_export.log 2>&1
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "macOS" ../releases/DragonHouse_v021_SQLite_macOS.zip \
            > ../releases/v021_final_mac_export.log 2>&1
          cd ../releases
          test -s DragonHouse_v021_SQLite.exe
          test -s DragonHouse_v021_SQLite.pck
          test -s DragonHouse_v021_SQLite_macOS.zip
          unzip -t DragonHouse_v021_SQLite_macOS.zip | tail -1
          test -n "$(find . -maxdepth 8 -type f -iname '*gdsqlite*.dll' -print -quit)"
          unzip -l DragonHouse_v021_SQLite_macOS.zip | grep -qi 'gdsqlite.*macos.*template_release'
          echo "SQLITE_FINAL_EXPORT_V021_PASS vendored=yes windows_dll=packaged macos_framework=packaged real_lfs=yes"

      - name: Store final proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-v021-final-proof
          path: |
            /tmp/v021-final-lfs.json
            /tmp/v021-final-export-import.log
            releases/v021_final_win_export.log
            releases/v021_final_mac_export.log
          retention-days: 3
          if-no-files-found: ignore
