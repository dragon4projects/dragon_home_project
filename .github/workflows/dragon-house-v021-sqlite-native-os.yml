name: Dragon House v0.21 SQLite native OS proof

on:
  push:
    branches:
      - dev/dragon-house-v021-sqlite-backend-proof
    paths:
      - 'dragon_house_clean/scripts/world_event_store_sqlite.gd'
      - 'dragon_house_clean/scripts/object_event_runtime.gd'
      - 'dragon_house_clean/tests/test_object_event_sqlite_v021.gd'
      - 'dragon_house_clean/tests/test_object_event_json_to_sqlite_v021.gd'
      - 'dragon_house_clean/tests/test_object_event_sqlite_recovery_v021.gd'
      - '.github/workflows/dragon-house-v021-sqlite-native-os.yml'
  workflow_dispatch:

concurrency:
  group: dragon-house-v021-sqlite-native-os
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install pinned Godot 4.7.2 and SQLite addon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\godot.zip" -Algorithm SHA256).Hash.ToLower() -ne "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953") { throw "Godot digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" "$env:RUNNER_TEMP\godot" -Force
          $godot = (Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter "Godot_v4.7.2-stable_win64.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot exe missing" }
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Invoke-WebRequest -Uri "https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip" -OutFile "$env:RUNNER_TEMP\sqlite.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\sqlite.zip" -Algorithm SHA256).Hash.ToLower() -ne "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0") { throw "SQLite addon digest mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\sqlite.zip" "$env:RUNNER_TEMP\sqlite" -Force
          $descriptor = Get-ChildItem "$env:RUNNER_TEMP\sqlite" -Filter "gdsqlite.gdextension" -Recurse | Select-Object -First 1
          if (-not $descriptor) { throw "SQLite descriptor missing" }
          New-Item -ItemType Directory -Path "dragon_house_clean\addons" -Force | Out-Null
          Copy-Item $descriptor.Directory.FullName "dragon_house_clean\addons\godot-sqlite" -Recurse -Force
          if (-not (Test-Path "dragon_house_clean\addons\godot-sqlite\bin\libgdsqlite.windows.template_release.x86_64.dll")) { throw "Windows release SQLite DLL missing" }
          & $godot --headless --version

      - name: Run SQLite truth-path tests natively on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType File -Path "dragon_house_clean\\assets\\.gdignore" -Force | Out-Null
          $tests = @(
            "res://tests/test_object_event_sqlite_v021.gd",
            "res://tests/test_object_event_json_to_sqlite_v021.gd",
            "res://tests/test_object_event_sqlite_recovery_v021.gd"
          )
          foreach ($test in $tests) {
            Write-Host "RUN $test"
            $output = & "$env:GODOT_BIN" --headless --path dragon_house_clean --script $test 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "$test exit code $LASTEXITCODE" }
            if ($output -notmatch "_PASS") { throw "$test missing PASS marker" }
            if ($output -match "SCRIPT ERROR|Parse Error|Assertion failed") { throw "$test contains script failure" }
          }
          Write-Host "SQLITE_NATIVE_WINDOWS_V021_PASS"

  macos-native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install pinned Godot 4.7.2 and SQLite addon
        shell: bash
        run: |
          set -euo pipefail
          echo "ARCH=$(uname -m)"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  $RUNNER_TEMP/godot.zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fLsS --retry 3 -o "$RUNNER_TEMP/sqlite.zip" \
            https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip
          echo "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0  $RUNNER_TEMP/sqlite.zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/sqlite"
          mkdir -p "$RUNNER_TEMP/sqlite"
          unzip -q "$RUNNER_TEMP/sqlite.zip" -d "$RUNNER_TEMP/sqlite"
          DESCRIPTOR="$(find "$RUNNER_TEMP/sqlite" -name gdsqlite.gdextension -type f | head -1)"
          test -n "$DESCRIPTOR"
          mkdir -p dragon_house_clean/addons
          cp -a "$(dirname "$DESCRIPTOR")" dragon_house_clean/addons/godot-sqlite
          test -d dragon_house_clean/addons/godot-sqlite/bin/libgdsqlite.macos.template_release.framework
          "$GODOT_BIN" --headless --version

      - name: Run SQLite truth-path tests natively on macOS
        shell: bash
        run: |
          set -euo pipefail
          touch dragon_house_clean/assets/.gdignore
          cd dragon_house_clean
          for t in \
            tests/test_object_event_sqlite_v021.gd \
            tests/test_object_event_json_to_sqlite_v021.gd \
            tests/test_object_event_sqlite_recovery_v021.gd; do
            echo "RUN $t"
            out="$("$GODOT_BIN" --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
          echo "SQLITE_NATIVE_MACOS_V021_PASS"
