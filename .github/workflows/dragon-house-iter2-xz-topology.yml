name: Dragon House Iteration 2 XZ topology

on:
  push:
    branches: [integration/dragon-house-iter2-xz-topology]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout actual LFS content
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch all required LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          test "$(git lfs ls-files | wc -l)" -ge 2443

      - name: Hydrate immutable TEEA review assets
        shell: bash
        run: |
          set -euo pipefail
          bash dragon_house_clean/tools/hydrate_iter1_candidate_assets.sh

      - name: Download official Godot 4.7.2 Linux
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/Godot_4.7.2.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/Godot_4.7.2.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 900s /tmp/Godot_v4.7.2-stable_linux.x86_64             --headless --path . --editor --quit > godot_import_iter2.log 2>&1
          if grep -Eq "SCRIPT ERROR|Parse Error" godot_import_iter2.log; then
            tail -180 godot_import_iter2.log
            exit 1
          fi

      - name: Run physical topology and production regressions
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          : > godot_tests_iter2.log
          marker="data/integration_candidates/ITER1_OWNER_REVIEW.enabled"
          mv "$marker" /tmp/ITER1_OWNER_REVIEW.enabled
          restore_marker() {
            if [ -f /tmp/ITER1_OWNER_REVIEW.enabled ]; then
              mv /tmp/ITER1_OWNER_REVIEW.enabled "$marker"
            fi
          }
          trap restore_marker EXIT
          for t in             tests/test_model.gd             tests/test_room_stations_v07.gd             tests/test_xz_topology_iter2.gd             tests/test_camera_construction.gd             tests/test_private_door_note_v016.gd             tests/test_object_lifecycle_v017.gd             tests/test_ambient_creatures_v018.gd             tests/test_content_viewer_v018.gd             tests/test_guest_room_access_v018.gd             tests/test_life_scheduler_v019.gd             tests/test_life_due_wake_integration_v019.gd             tests/test_semantic_view_v019.gd             tests/test_object_event_default_sqlite_v021.gd             tests/test_object_event_sqlite_v021.gd             tests/test_object_event_sqlite_recovery_v021.gd
          do
            echo "RUN $t" | tee -a godot_tests_iter2.log
            result="$(timeout 100s /tmp/Godot_v4.7.2-stable_linux.x86_64               --headless --path . --script "res://$t" 2>&1)" || {
                echo "$result" | tee -a godot_tests_iter2.log
                exit 1
              }
            echo "$result" | tee -a godot_tests_iter2.log
            echo "$result" | grep -q "_PASS"
            ! echo "$result" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
          restore_marker
          trap - EXIT

      - name: Run review runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          for t in tests/test_iter1_owner_review.gd tests/test_iter2_runtime_scene.gd
          do
            echo "RUN REVIEW $t" | tee -a godot_tests_iter2.log
            result="$(timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64               --headless --path . --script "res://$t" 2>&1)" || {
                echo "$result" | tee -a godot_tests_iter2.log
                exit 1
              }
            echo "$result" | tee -a godot_tests_iter2.log
            echo "$result" | grep -q "_PASS"
            ! echo "$result" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done

      - name: Render XZ review evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          cd dragon_house_clean
          mkdir -p private_review
          xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path .             --rendering-method gl_compatibility             --script res://tests/capture_v014_review.gd | tee iter2_render_review.log
          grep -q "V014_RENDER_REVIEW_PASS" iter2_render_review.log

      - name: Download official Godot 4.7.2 export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot_export.tpz             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -jo /tmp/godot_export.tpz templates/version.txt templates/macos.zip -d "$dest"

      - name: Export macOS Universal XZ build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cd dragon_house_clean
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path .             --export-release "macOS" ../releases/DragonHouse_Iter2_XZ_macOS_Universal.zip             > ../releases/mac_export_iter2.log 2>&1
          cd ../releases
          unzip -t DragonHouse_Iter2_XZ_macOS_Universal.zip | tail -1
          unzip -l DragonHouse_Iter2_XZ_macOS_Universal.zip | grep -qi 'gdsqlite.*macos.*template_release'
          cp DragonHouse_Iter2_XZ_macOS_Universal.zip DragonHouse_Iter2_XZ_macOS15_M1.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: DragonHouse-Iter2-XZ-macOS15-M1
          path: |
            releases/DragonHouse_Iter2_XZ_macOS15_M1.zip
            releases/mac_export_iter2.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload Iteration 2 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DragonHouse-Iter2-XZ-QA
          path: |
            dragon_house_clean/godot_import_iter2.log
            dragon_house_clean/godot_tests_iter2.log
            dragon_house_clean/iter2_render_review.log
            dragon_house_clean/private_review/v014_house.png
            dragon_house_clean/private_review/v014_common_r3.png
            dragon_house_clean/private_review/v014_library_r2.png
            dragon_house_clean/private_review/v014_cinema_activity.png
          if-no-files-found: ignore
          retention-days: 7
