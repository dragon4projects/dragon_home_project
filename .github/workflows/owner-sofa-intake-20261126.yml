name: Verified sofa derivative intake
on:
  push:
    branches: [fix/owner-sofa-repair-20261126]
    paths: ['.github/workflows/owner-sofa-intake-20261126.yml']
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify single authorized derivative
        run: |
          curl -fL --max-time 90 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JdI9kJ82xObF8Bi3EgU4P6DaoR/b8e85cbd-d8dd-4871-8ac7-062ed8a11dde.zip' -o /tmp/sofa.zip
          echo 'd96aaf3780c37652658ffffc277f2055333e678162aaa69ff2dc40eae6f69041  /tmp/sofa.zip' | sha256sum -c -
          p=dragon_house_clean/assets/decor_bank/blendkit_sofa/repaired.glb
          test ! -e "$p"
          unzip -p /tmp/sofa.zip iter52_sofa.glb > "$p"
          echo "9753bf88be71aa8fa4f042948af378afba45bf76333022c0294b175761d3247e  $p" | sha256sum -c -
          git lfs install --local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          git commit -m '[skip ci] Store verified owner sofa repair'
          git push origin HEAD:fix/owner-sofa-repair-20261126
