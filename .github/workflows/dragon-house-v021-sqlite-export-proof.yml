name: Dragon House v0.21 SQLite Windows-macOS packaging proof

on:
  push:
    branches:
      - dev/dragon-house-v021-sqlite-backend-proof
    paths:
      - 'dragon_house_clean/scripts/world_event_store_sqlite.gd'
      - 'dragon_house_clean/scripts/object_event_runtime.gd'
      - 'dragon_house_clean/tests/test_object_event_sqlite_v021.gd'
      - 'dragon_house_clean/tests/test_object_event_json_to_sqlite_v021.gd'
      - 'dragon_house_clean/tests/test_object_event_sqlite_recovery_v021.gd'
      - '.github/workflows/dragon-house-v021-sqlite-export-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Fetch real LFS bytes
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          test "$(git lfs ls-files | wc -l)" -ge 2408
          cd dragon_house_clean
          python3 tools/ci_lfs_asset_audit.py --project . --report /tmp/v021_lfs.json

      - name: Download official Godot 4.7.2
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Install pinned godot-sqlite v4.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot-sqlite-addons.zip \
            https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip
          echo "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0  /tmp/godot-sqlite-addons.zip" | sha256sum -c -
          rm -rf /tmp/godot-sqlite
          mkdir -p /tmp/godot-sqlite
          unzip -q /tmp/godot-sqlite-addons.zip -d /tmp/godot-sqlite
          cd dragon_house_clean
          mkdir -p addons
          if [ -d /tmp/godot-sqlite/addons/godot-sqlite ]; then
            cp -a /tmp/godot-sqlite/addons/godot-sqlite addons/
          elif [ -d /tmp/godot-sqlite/godot-sqlite ]; then
            cp -a /tmp/godot-sqlite/godot-sqlite addons/
          else
            exit 1
          fi
          test -f addons/godot-sqlite/gdsqlite.gdextension
          grep -q 'compatibility_minimum = "4.7"' addons/godot-sqlite/gdsqlite.gdextension

      - name: Import project and prove SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 900s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/v021_import.log 2>&1
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/v021_import.log; then
            tail -120 /tmp/v021_import.log
            exit 1
          fi
          for t in \
            tests/test_object_event_sqlite_v021.gd \
            tests/test_object_event_json_to_sqlite_v021.gd \
            tests/test_object_event_sqlite_recovery_v021.gd; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done

      - name: Download official export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot_export.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -jo /tmp/godot_export.tpz \
            templates/version.txt templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64.exe templates/macos.zip -d "$dest"

      - name: Export real Windows and macOS packages with SQLite extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cd dragon_house_clean
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "Windows Desktop" ../releases/DragonHouse_v021_SQLite.exe \
            > ../releases/v021_win_export.log 2>&1
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "macOS" ../releases/DragonHouse_v021_SQLite_macOS.zip \
            > ../releases/v021_mac_export.log 2>&1
          cd ../releases
          test -s DragonHouse_v021_SQLite.exe
          test -s DragonHouse_v021_SQLite.pck
          test -s DragonHouse_v021_SQLite_macOS.zip
          unzip -t DragonHouse_v021_SQLite_macOS.zip | tail -1
          echo "--- release files ---"
          find . -maxdepth 6 -type f -printf '%p %s bytes\n' | sort
          echo "--- mac sqlite members ---"
          unzip -l DragonHouse_v021_SQLite_macOS.zip | grep -i gdsqlite
          test -n "$(find . -maxdepth 6 -type f -iname '*gdsqlite*.dll' -print -quit)"
          unzip -l DragonHouse_v021_SQLite_macOS.zip | grep -qi 'gdsqlite.*macos.*template_release'
          echo "SQLITE_EXPORT_V021_PASS windows_dll=packaged macos_framework=packaged real_lfs=yes"

      - name: Store packaging proof logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-v021-sqlite-packaging-proof
          path: |
            releases/v021_win_export.log
            releases/v021_mac_export.log
            /tmp/v021_lfs.json
          if-no-files-found: ignore
          retention-days: 3
